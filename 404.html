<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>Sổ Theo Dõi Động Vật Hoang Dã - Hạt Kiểm Lâm Krông Bông</title>
    <script type="text/javascript">
      // Redirect legacy subpath /dvhd/ or any 404 to root custom domain
      var l = window.location;
      var cleanPath = l.pathname.replace(/^\/dvhd/, '');
      if (!cleanPath || cleanPath === '') {
        cleanPath = '/';
      }
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + cleanPath + l.search + l.hash);
    </script>
  </head>

  </body>
</html>
