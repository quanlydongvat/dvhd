<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>Sổ Theo Dõi Động Vật Hoang Dã - Hạt Kiểm Lâm Krông Bông</title>
    <script type="text/javascript">
      // Clean redirect for 404 routes or legacy /dvhd/ subpath back to root home
      var l = window.location;
      if (l.pathname.includes('/assets/') || l.pathname.endsWith('.js') || l.pathname.endsWith('.css')) {
        // Break 404 asset redirect loop and load home
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + l.search + l.hash);
      } else {
        var cleanPath = l.pathname.replace(/^\/dvhd/, '');
        if (!cleanPath || cleanPath === '') cleanPath = '/';
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + cleanPath + l.search + l.hash);
      }
    </script>
  </head>
  <body>
  </body>
</html>
