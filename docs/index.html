    <!-- Inline Auto-Purge Cache & Unregister SW Script to fix white screen -->
    <script>
      (function() {
        const CURRENT_APP_VERSION = 'v2026.08.26_FORCE_PURGE_v9999';
        if (localStorage.getItem('wildlife_app_ver') !== CURRENT_APP_VERSION) {
          localStorage.setItem('wildlife_app_ver', CURRENT_APP_VERSION);
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
        }
      })();
    </script>

    <!-- SPA redirect decode script for GitHub Pages custom domain routing -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
