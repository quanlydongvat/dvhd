      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          var targetPath = l.pathname.replace(/\/+$/, '') + decoded + l.hash;
          targetPath = targetPath.replace(/^\/dvhd\/?/, '/');
          window.history.replaceState(null, null, targetPath || '/');

    <!-- Watchdog & Self-Healing Script -->
    <script>
      function pwaForceCleanReload() {
        var btn = document.getElementById('pwa-recovery-btn');
        if (btn) btn.innerText = 'Đang làm mới bộ nhớ đệm...';
        try {
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).then(function() {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  return Promise.all(regs.map(function(r) { return r.unregister(); }));
                }).then(function() {
                  window.location.href = '/?v=' + Date.now();
                });
              } else {
                window.location.href = '/?v=' + Date.now();
              }
            });
            return;
          }
        } catch(e) {}
        window.location.href = '/?v=' + Date.now();
      }

      // If React takes more than 3.5s (due to slow network or old cached module error), reveal the refresh button
      setTimeout(function() {
        var splash = document.getElementById('pwa-splash');
        var btn = document.getElementById('pwa-recovery-btn');
        var status = document.getElementById('pwa-status-text');
        if (splash && btn) {
          btn.style.display = 'inline-block';
          if (status) status.innerText = 'Đang đồng bộ phiên bản mới...';
        }
      }, 3500);

      // Auto self-heal on unhandled module loading error
      window.addEventListener('error', function(e) {
        if (e && e.message && (

          e.message.indexOf('Loading chunk') !== -1 ||
          e.message.indexOf('Failed to fetch') !== -1 ||
          e.message.indexOf('module') !== -1
        )) {
          console.warn('[PWA Watchdog] Detected resource loading error, scheduling self-heal...', e.message);
          setTimeout(pwaForceCleanReload, 2000);
        }
      });
