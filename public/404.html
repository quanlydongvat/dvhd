<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>Sổ Theo Dõi Động Vật Hoang Dã - Hạt Kiểm Lâm Krông Bông</title>
    <script type="text/javascript">
      // GitHub Pages SPA Redirect to fix 404 on PWA launch & subroutes
      var l = window.location;
      var repoPath = '/dvhd/';
      if (!l.pathname.startsWith(repoPath)) {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoPath);
      } else {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoPath + '?redirect=' + encodeURIComponent(l.pathname));
      }
    </script>
  </head>
  <body>
  </body>
</html>
